<!doctype html>
<html lang="lo"><head><meta charset="utf-8"><title>ແຈ່ວບອງ · ຈັດການອໍເດີ້</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao+Looped:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#12302d;--mut:#66807c;--line:#d5e0dd;--pri:#114e48;--on:#fff;--acc:#e06c3c;--soft:#eaf0ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a18;--card:#15272a;--ink:#e6f0ee;--mut:#93aaa6;--line:#2b4440;--pri:#1b6b62;--soft:#1b2f2c}}
:root[data-theme="dark"]{--bg:#0d1a18;--card:#15272a;--ink:#e6f0ee;--mut:#93aaa6;--line:#2b4440;--pri:#1b6b62;--soft:#1b2f2c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 'Noto Sans Lao Looped','Noto Sans Lao',system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.lg{width:52px;height:52px;border-radius:12px;background:#fff;object-fit:contain}
.tt{flex:1;display:flex;flex-direction:column;line-height:1.25}.tt span{color:var(--mut);font-size:13px}
main{padding:16px 16px 110px;max-width:640px;margin:0 auto}
h1{font-size:26px;margin:4px 0 0;line-height:1.3}h2{font-size:18px;margin:0 0 4px}
.sub,.mut{color:var(--mut);font-size:14px;margin:2px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:0 0 14px}
label{display:block;font-weight:600;font-size:14px;margin-top:14px}
.in{display:block;width:100%;margin-top:6px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit}
.btn{display:block;width:100%;margin-top:14px;padding:13px;border:1.5px solid var(--line);border-radius:16px;background:var(--soft);color:var(--ink);font:600 16px inherit;font-family:inherit;cursor:pointer}
.btn.o{background:var(--acc);border-color:var(--acc);color:#fff}.btn.p{background:var(--pri);border-color:var(--pri);color:var(--on)}
.btn.sm{width:auto;margin:0;padding:10px 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{padding:9px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--soft);color:var(--ink);font:inherit;cursor:pointer}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--on)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.it{border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;background:var(--bg)}
.it .r2{grid-template-columns:1fr 100px auto;margin-top:8px}.it .in{margin:0}
.ln{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding:14px;border-radius:16px;background:var(--soft)}.tot b{font-size:24px;color:var(--pri)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}.stat span{display:block;color:var(--mut);font-size:13px}.stat b{font-size:20px}
.stat.net{grid-column:span 2;background:var(--pri);border-color:var(--pri);color:var(--on)}.stat.net span{color:#cfe5e1}.stat.net b{font-size:28px}
.pill.on{background:#114e48;color:#fff}
.pill.warn{background:var(--acc);color:#fff;cursor:pointer;font-weight:700}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--soft);font-size:12px;color:var(--mut)}
.oh{display:flex;justify-content:space-between;gap:10px}.oid{font-weight:700;color:var(--pri)}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:11px;padding:6px 2px;border-radius:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center}
nav button i{font-style:normal;font-size:20px}nav button.on{background:var(--soft);color:var(--pri);font-weight:700}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--pri);color:var(--on);padding:12px 16px;border-radius:14px;text-align:center;display:none;z-index:9}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.inv{background:#fff;color:#12302d;border-radius:18px;padding:22px;border:1px solid var(--line)}
.inv .ih{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px solid #114e48;padding-bottom:8px}.inv .ih span{color:#66807c;font-size:14px}
.inv h2{margin:14px 0 2px;font-size:22px}.inv .mt{color:#66807c;font-size:14px;margin-bottom:6px}
.inv .pt{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0;font-size:15px}.inv .pt span{display:block;color:#66807c;font-size:13px}
.inv table{width:100%;border-collapse:collapse;margin-top:8px}.inv th{text-align:left;font-size:13px;color:#66807c;border-bottom:1.5px solid #d5e0dd;padding:6px 0}
.inv td{padding:9px 0;border-bottom:1px solid #e6eeec;vertical-align:top}.inv .r{text-align:right;white-space:nowrap;padding-left:10px}
.inv .cod{margin-top:16px;padding:14px;border-radius:14px;background:#114e48;color:#fff}.inv .cod div{display:flex;justify-content:space-between;align-items:baseline}.inv .cod b{font-size:26px}.inv .cod p{margin:6px 0 0;font-size:14px;color:#cfe5e1}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px}.bars i{flex:1;background:var(--pri);border-radius:4px 4px 0 0;min-width:3px}
.inv{font-size:19px}.inv h2{font-size:30px}.inv .cod b{font-size:32px}.inv .cod p{font-size:20px}
@media print{header,nav,.np,#toast{display:none!important}main{padding:0;max-width:none}body{background:#fff}.inv{border:0;padding:0}}

<header><img class="lg" id="lgo" alt="ແຈ່ວບອງ"><div class="tt"><b>ແຈ່ວບອງ</b><span>ອາຫານຫຼວງພະບາງ</span></div><span id=dot class=pill>ໃນເຄື່ອງ</span><button id=lo class="btn sm" style="display:none;padding:8px 12px" onclick="logout()">ອອກ</button><button class="btn o sm" onclick="go('new')">+ ສ້າງ</button></header>
